<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D0A"/>
      <stop offset="100%" stop-color="#040705"/>
    </linearGradient>
    <linearGradient id="em" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#em)" stroke-width="8" opacity="0.4"/>
  <!-- Graduation / Brain / Target Symbol -->
  <g filter="url(#glow)">
    <!-- Graduation Cap -->
    <path d="M256 120 L400 196 L256 272 L112 196 Z" fill="url(#em)"/>
    <path d="M160 224 L160 296 C160 340 200 376 256 376 C312 376 352 340 352 296 L352 224" fill="none" stroke="url(#em)" stroke-width="20" stroke-linecap="round"/>
    <path d="M400 196 L400 310" stroke="url(#em)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="400" cy="316" r="14" fill="#34D399"/>
    <!-- Code / Target brackets -->
    <path d="M200 316 L176 340 L200 364" fill="none" stroke="#6EE7B7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M312 316 L336 340 L312 364" fill="none" stroke="#6EE7B7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M266 306 L246 374" stroke="#6EE7B7" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
